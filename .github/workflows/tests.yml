name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mcp-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.11.23
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Check dependency consistency
        run: uv pip check
      - name: Test without SENAMHI access
        run: uv run --locked python -m unittest discover -s scripts -p "test_*.py"
