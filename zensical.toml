[project]
site_name = "Garúa"
site_url = "https://garua.danyneyra.dev"
site_description = "Garúa es un CLI y servidor MCP para trabajar con datos hidrometeorológicos oficiales del SENAMHI Perú. Descarga, analiza y valida datos de SENAMHI con IA."
site_author = "Dany Daniel Neyra"
copyright = "Dany Daniel Neyra :)"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/danyneyra/garua"
repo_name = "danyneyra/garua"
dev_addr = "localhost:8000"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/terminal.js"]

nav = [
  {"Garúa" = "index.md"},
  {"Primeros pasos" = [
    {"Primeros pasos" = "quickstart.md"},
    {"Instalación" = "installation.md"},
    {"Cómo citar Garúa" = "citation.md"},
  ]},
  {"Uso" = [
    {"Uso CLI" = "usage/cli.md"},
    {"¿Qué es MCP en Garúa?" = "usage/mcp-concept.md"},
    {"Uso MCP Server" = "usage/mcp.md"},
    {"Ejemplos completos" = "usage/examples.md"},
  ]},
  {"Guías" = [
    {"Buscar estaciones" = "guides/buscar-estaciones.md"},
    {"Descargar datos" = "guides/descargar-datos.md"},
    {"Explorar CSV" = "guides/explorar-csv.md"},
    {"Resumir un período" = "guides/resumir-periodo.md"},
    {"Comparar periodos" = "guides/comparar-periodos.md"},
    {"Validar calidad de datos" = "guides/validar-datos.md"},
    {"Recomendar estación" = "guides/recomendar-estacion.md"},
  ]},
  {"Referencia" = [
    {"Referencia de tools MCP" = "reference/tools.md"},
    {"Referencia CLI" = "reference/cli.md"},
    {"Variables de entorno" = "reference/environment.md"},
    {"Archivos de salida" = "reference/output-files.md"},
    {"Calidad de datos" = "reference/data-quality.md"},
  ]},
  {"Desarrollo" = [
    {"Arquitectura" = "development/architecture.md"},
    {"Servidor MCP" = "development/mcp-server.md"},
    {"Compatibilidad con FastMCP 4" = "development/fastmcp-4.md"},
    {"Contribuir" = "development/contributing.md"},
    {"Publicar versiones" = "development/releases.md"},
  ]},
  {"Novedades" = "changelog.md"},
]


[project.theme]
custom_dir = "overrides"
language = "es"
font.text="DM Sans"
logo = "images/logo.svg"
favicon = "images/logo.svg"
features = [
  "announce.dismiss",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.footnote.tooltips",
  "content.tooltips",
  "content.tabs.link"
]

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/danyneyra/garua"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/garua/"


